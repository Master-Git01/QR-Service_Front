<div class="topbar topbar--transparent">
  <div class="topbar__inner container">
    <div class="topbar__logo" routerLink="/auth/generate-dinamic-qr">
      <div class="topbar__logo-img-wrapper">
        <img src="/assets/logo_prizma.png" alt="QR logo" class="topbar__logo-img" />
      </div>
    </div>

    <div class="topbar__spacer" aria-hidden="true"></div>

    <nav
      class="topbar__auth auth-links"
      aria-label="auth links"
      *ngIf="authStatus$ | async as status"
    >
      <ng-container *ngIf="status === 'authenticated'; else guestLinks">
        <button class="auth-links__btn--profile" type="button" routerLink="/auth/profile">
          <a class="auth-links__link">Профиль</a>
          <img class="auth-links__profile-img" src="/assets/profileIcon.png" alt="profile icon" />
        </button>
      </ng-container>

      <ng-template #guestLinks>
        <button
          class="auth-links__btn auth-links__btn--onboard"
          routerLink="/onboard"
          type="button"
          (click)="goToSignup()"
        >
          Авторизиризоваться
        </button>
      </ng-template>
    </nav>
  </div>
</div>
