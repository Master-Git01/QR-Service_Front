<div class="auth" *ngIf="otpState$ | async as otp">
  <button class="home" aria-label="На главную" (click)="goHome()">← На главную</button>

  <div class="auth__body">
    <ng-container *ngIf="otp">
      <app-otp-form
        *ngIf="otp.status && otp?.status === 'waitingCode'"
        [phoneNumber]="otp?.maskedPhone"
        (submitCode)="onSubmit($event)"
        (resendOtp)="onResendOtp()"
        (changePhone)="onChangePhone()"
      ></app-otp-form>

      <app-onboard *ngIf="otp.status && otp?.status === 'idle'"></app-onboard>
    </ng-container>
  </div>
</div>
