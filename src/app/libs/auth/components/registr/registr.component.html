<div class="register">
  <div class="register__card">
    <div class="register__head">
      <div class="register__brand">Регистрация</div>
      <div class="register__hint">Быстрая регистрация по SMS</div>
    </div>

    <div class="register__body">
      <section class="register__step register__step--phone" aria-hidden="false" data-step="phone">
        <h2 class="register__title">Введите номера телефона</h2>
        <p class="register__desc">Мы пришлём код в SMS. Никаких паролей.</p>

        <label class="register__label">
          <span class="register__label-text">Номер телефона</span>
          <input
            [formControl]="inputField"
            class="register__input"
            type="tel"
            placeholder="+7 900 000-00-00"
            data-hook="phone-input"
          />
          <small
            *ngIf="inputField.invalid && inputField.touched"
            class="register__error"
            style="color: red"
            role="alert"
            aria-live="polite"
          >
            Пожалуйста, введите корректный номер телефона.
          </small>
        </label>

        <div class="register__actions">
          <button
            class="register__btn register__btn--primary"
            [disabled]="inputField.invalid"
            (click)="onSubmit()"
          >
            Получить код
          </button>
          <button
            class="register__btn register__btn--ghost"
            type="button"
            (click)="inputField.reset()"
          >
            Очистить
          </button>
        </div>
      </section>

      <div class="register__footer">
        <span class="register__footer-text">Уже есть аккаунт?</span>
        <a class="register__footer-link" [routerLink]="['/login']" [queryParams]="{ mode: 'login' }"
          >Войти</a
        >
      </div>
    </div>
  </div>
</div>
