<section class="qr-generate__container">
  <app-fast-qr-generation
    class="qr-generate__col"
    (generate)="generateQr($event)"
    (clear)="clearAll()"
    (urlChange)="onUrlChange($event)"
  ></app-fast-qr-generation>

  <app-qr-preview
    class="qr-generate__col"
    [qrUrl]="qrDataUrl$$ | async"
    [hasQr]="!!(downloadButton$$ | async)"
    (download)="download()"
  ></app-qr-preview>

  <app-hints class="qr-generate__full"></app-hints>
</section>
